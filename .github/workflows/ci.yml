name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FIREBASE_TOOLS_VERSION: 15.20.0
  LHCI_VERSION: 0.15.1
  E2E_BASE_URL: http://127.0.0.1:9002

jobs:
  unit-tests:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  e2e:
    name: E2E (emulator + TEST_MODE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # firebase-tools 15 requires Java 21 for the emulators.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Build app (E2E config — emulator client flags baked in)
        run: npm run build:e2e

      - name: Start Firebase emulators
        run: |
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} emulators:start \
            --only auth,firestore,storage --project demo-storypic-e2e &
          npx --yes wait-on tcp:127.0.0.1:9099 tcp:127.0.0.1:8080 tcp:127.0.0.1:9199 --timeout 120000

      - name: Start app (standalone build, TEST_MODE)
        run: |
          node scripts/start-e2e-server.mjs &
          npx --yes wait-on ${{ env.E2E_BASE_URL }}/login --timeout 120000

      # ── BLOCKING GATE ───────────────────────────────────────────────────
      # The funnel happy-path (+ login smoke) must pass for the job to pass.
      # Promoted from report-only after 3 consecutive deterministic green
      # runs locally (2026-06-11, see docs/testing/e2e.md).
      - name: Funnel E2E (blocking)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.E2E_BASE_URL }}
        run: |
          npx playwright test e2e/funnel.spec.ts e2e/login.smoke.spec.ts \
            --project=desktop-chrome --project=mobile-chrome

      # ── REPORT-ONLY (promotion criteria in docs/testing/e2e.md) ────────
      - name: Accessibility scans (report-only)
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.E2E_BASE_URL }}
        run: |
          npx playwright test e2e/a11y.spec.ts --project=desktop-chrome \
            --reporter=list --output=test-results-a11y

      - name: Visual regression (report-only)
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.E2E_BASE_URL }}
        run: |
          npx playwright test e2e/visual.spec.ts \
            --project=desktop-chrome --project=mobile-chrome \
            --reporter=list --output=test-results-visual

      - name: Lighthouse CI (report-only)
        continue-on-error: true
        run: npx --yes @lhci/cli@${{ env.LHCI_VERSION }} autorun

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # May contain screenshots of synthetic child-like content — short
      # retention, failure diagnostics only.
      - name: Upload test results (a11y attachments, visual candidates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            test-results-a11y/
            test-results-visual/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 7
          if-no-files-found: ignore
