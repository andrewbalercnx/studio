name: System Tests

# Runs daily against the live deployment to catch model deprecations,
# Firestore rule changes, or pipeline regressions that unit tests can't catch.
#
# Required GitHub configuration:
#   Secrets:  INTERNAL_API_SECRET  (same value as apphosting.yaml INTERNAL_API_SECRET)
#
# Set at: https://github.com/andrewbalercnx/studio/settings/secrets/actions/new

env:
  APP_URL: https://storypic.rcnx.io

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  system-test:
    name: Live Pipeline Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run system test endpoint
        id: run
        run: |
          RESPONSE=$(curl -sf --max-time 300 \
            -X POST \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.APP_URL }}/api/internal/system-test")
          echo "response<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.ok == true'

      - name: Write job summary
        if: always()
        run: |
          echo "## System Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status | Message | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|---------|----------|" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.run.outputs.response }}' \
            | jq -r '.results[]? | "| `\(.name)` | \(if .pass then "✅ PASS" else "❌ FAIL" end) | \(.message) | \(.durationMs)ms |"' \
            >> $GITHUB_STEP_SUMMARY \
            || echo "| — | ❌ ERROR | Could not parse response | — |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(echo '${{ steps.run.outputs.response }}' | jq -r '.totalDurationMs // "?"')
          echo "_Total duration: ${TOTAL}ms_" >> $GITHUB_STEP_SUMMARY
